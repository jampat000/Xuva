root = "."
tmp_dir = ".air"

[build]
  cmd = "go build -o .air/xuva.exe ./cmd/Xuva/..."
  bin = ".air/xuva.exe"
  full_bin = ".air/xuva.exe"
  include_ext = ["go"]
  exclude_dir  = [".air", "vendor"]
  exclude_file = []
  delay = 500
  kill_delay = "500ms"
  send_interrupt = true
  stop_on_error = false
  log = ".air/build.log"

[log]
  time = false
  main_only = true

[color]
  main     = "magenta"
  watcher  = "cyan"
  build    = "yellow"
  runner   = "green"

[misc]
  clean_on_exit = true
