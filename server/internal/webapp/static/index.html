<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vyrden</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app">
    <aside class="nav">
      <div class="brand">
        <div class="mark" aria-label="Vyrden">V</div>
        <div>
          <strong>Vyrden</strong>
          <span>Private cinema</span>
        </div>
      </div>

      <div class="nav-label">Library</div>
      <nav class="nav-group" aria-label="Library">
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">H</span><span class="nav-text">Home</span></button>
        <button class="nav-item" data-view="movies"><span class="nav-icon">M</span><span class="nav-text">Movies</span></button>
        <button class="nav-item" data-view="tv"><span class="nav-icon">TV</span><span class="nav-text">TV Shows</span></button>
        <button class="nav-item" data-view="libraries"><span class="nav-icon">L</span><span class="nav-text">Libraries</span></button>
      </nav>

      <div class="nav-label">System</div>
      <nav class="nav-group" aria-label="System">
        <button class="nav-item" data-view="playback"><span class="nav-icon">P</span><span class="nav-text">Playback</span></button>
        <button class="nav-item" data-view="activity"><span class="nav-icon">A</span><span class="nav-text">Activity</span></button>
        <button class="nav-item" data-view="health"><span class="nav-icon">R</span><span class="nav-text">Review</span></button>
        <button class="nav-item" data-view="remote"><span class="nav-icon">N</span><span class="nav-text">Remote Access</span></button>
        <button class="nav-item" data-view="settings"><span class="nav-icon">S</span><span class="nav-text">Settings</span></button>
      </nav>

      <div class="nav-footer">
        <span>Local server</span>
        <strong>Private runtime</strong>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <input class="search" id="globalSearch" placeholder="Search movies, shows, codecs, filenames" oninput="filterCards(this.value)">
        <div class="status-row">
          <span class="badge good"><i id="serverDot"></i><strong id="serverStatus">Checking</strong></span>
          <span class="badge route">LAN Direct</span>
          <span class="badge warn" id="viewTitle">Home</span>
        </div>
      </header>

      <section id="view" class="view"></section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
