<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vyrden</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app" class="app">
    <aside class="nav">
      <div class="brand">
        <div class="mark" aria-label="Vyrden">
          <svg viewBox="0 0 48 48" role="img" aria-hidden="true">
            <path class="mark-frame" d="M12 6h24c3.3 0 6 2.7 6 6v24c0 3.3-2.7 6-6 6H12c-3.3 0-6-2.7-6-6V12c0-3.3 2.7-6 6-6Z"/>
            <path class="mark-v" d="M13.5 14.2h6.1l4.6 16.1 4.6-16.1h5.8L27.8 34h-7.4L13.5 14.2Z"/>
            <path class="mark-cut" d="M30.4 13.5h6.1L25 34.7h-6.1L30.4 13.5Z"/>
          </svg>
        </div>
        <div>
          <strong>Vyrden</strong>
          <span>Private Cinema</span>
        </div>
      </div>

      <div class="nav-label">Library</div>
      <nav class="nav-group" aria-label="Library">
        <button class="nav-item active" data-view="dashboard"><span>Home</span></button>
        <button class="nav-item" data-view="movies"><span>Movies</span></button>
        <button class="nav-item" data-view="tv"><span>TV Shows</span></button>
        <button class="nav-item" data-view="libraries"><span>Collections</span></button>
      </nav>

      <div class="nav-label">System</div>
      <nav class="nav-group" aria-label="System">
        <button class="nav-item" data-view="playback"><span>Playback</span></button>
        <button class="nav-item" data-view="activity"><span>Activity</span></button>
        <button class="nav-item" data-view="remote"><span>Remote Access</span></button>
        <button class="nav-item" data-view="settings"><span>Settings</span></button>
      </nav>
    </aside>

    <main class="main">
      <header class="topbar">
        <input class="search" id="globalSearch" placeholder="Search movies, shows, codecs, filenames" oninput="filterCards(this.value)">
        <div class="status-row">
          <div class="density-menu" id="densityMenu">
            <button class="density-select" id="densityButton" type="button" aria-label="Display density" aria-haspopup="menu" aria-expanded="false">
              <span id="densityLabel">Comfortable</span>
            </button>
            <div class="density-options" id="densityOptions" role="menu" aria-label="Display density options">
              <button type="button" role="menuitemradio" data-density-option="compact">Compact</button>
              <button type="button" role="menuitemradio" data-density-option="balanced">Balanced</button>
              <button type="button" role="menuitemradio" data-density-option="comfortable">Comfortable</button>
              <button type="button" role="menuitemradio" data-density-option="cinematic">Cinematic</button>
            </div>
          </div>
          <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch theme">Dark</button>
          <span class="badge good"><i id="serverDot"></i><strong id="serverStatus">Checking</strong></span>
          <span class="badge route">LAN Direct</span>
          <span class="badge warn" id="viewTitle">Home</span>
        </div>
      </header>

      <section id="view" class="view"></section>
    </main>
  </div>

  <script src="/app.js"></script>
</body>
</html>
