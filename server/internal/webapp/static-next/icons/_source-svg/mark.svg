<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Xuva icon mark — double chevron in dark rounded square.
    This is the canonical source for the mark used in:
      - favicon.svg (web browser tab)
      - XuvaIconMark.swift (Apple client nav bar / splash)
      - App icons (iOS / tvOS)
    The previous version of this file contained an old wedge/arrow design
    that was never shipped. Replaced to match what is actually in production.
  -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="oklch(0.55 0.22 285)"/>
      <stop offset="55%"  stop-color="oklch(0.65 0.20 280)"/>
      <stop offset="100%" stop-color="oklch(0.72 0.18 265)"/>
    </linearGradient>
    <linearGradient id="gi" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="white" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="16" fill="#080612"/>
  <rect width="64" height="64" rx="16" fill="url(#g)" opacity="0.18"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="url(#g)" stroke-opacity="0.5" stroke-width="1.5"/>
  <!-- Double chevron — both wrapped in glow filter -->
  <g filter="url(#glow)">
    <path d="M19 16 L37 32 L19 48" stroke="url(#g)"  stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M29 16 L47 32 L29 48" stroke="url(#gi)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
