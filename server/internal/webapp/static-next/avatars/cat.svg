  <line x1="16" y1="38" x2="28" y2="37.5" stroke="#9b8ab0" stroke-width="0.8"/>
  <line x1="48" y1="35" x2="36" y2="36" stroke="#9b8ab0" stroke-width="0.8"/>
  <line x1="48" y1="38" x2="36" y2="37.5" stroke="#9b8ab0" stroke-width="0.8"/>
</svg>
