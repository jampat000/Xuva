<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <circle cx="32" cy="32" r="32" fill="#f0f0f0"/>
  <!-- round ears -->
  <circle cx="15" cy="16" r="8" fill="#1a1a2e"/>
  <circle cx="49" cy="16" r="8" fill="#1a1a2e"/>
  <!-- face -->
  <ellipse cx="32" cy="35" rx="18" ry="16" fill="#f0f0f0"/>
  <!-- eye patches -->
  <ellipse cx="24" cy="29" rx="6" ry="5" fill="#1a1a2e" transform="rotate(-10 24 29)"/>
  <ellipse cx="40" cy="29" rx="6" ry="5" fill="#1a1a2e" transform="rotate(10 40 29)"/>
  <!-- eyes -->
  <circle cx="24" cy="30" r="3" fill="white"/>
  <circle cx="40" cy="30" r="3" fill="white"/>
  <circle cx="24" cy="30" r="1.8" fill="#1a1a2e"/>
  <circle cx="40" cy="30" r="1.8" fill="#1a1a2e"/>
  <circle cx="23" cy="29" r="0.8" fill="white"/>
  <circle cx="39" cy="29" r="0.8" fill="white"/>
  <!-- snout -->
  <ellipse cx="32" cy="39" rx="7" ry="5" fill="#e0d0d0"/>
  <!-- nose -->
  <ellipse cx="32" cy="36" rx="2.5" ry="1.8" fill="#1a1a2e"/>
  <!-- mouth -->
  <path d="M29.5 38.5 Q32 41 34.5 38.5" stroke="#888" stroke-width="1" fill="none" stroke-linecap="round"/>
</svg>
