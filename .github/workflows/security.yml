name: Security

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go-security:
    name: Go tests and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Agent harness check
        run: node tools/agent-check.cjs

      - name: Test
        working-directory: server
        run: go test ./...

      - name: Vulnerability scan
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend-typecheck:
    name: Frontend svelte-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/svelte/package-lock.json

      - name: Install dependencies
        working-directory: apps/web/svelte
        run: npm ci

      - name: Type-check (svelte-check)
        working-directory: apps/web/svelte
        run: npm run check:ci

  frontend-unit-tests:
    name: Frontend Vitest unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/svelte/package-lock.json

      - name: Install dependencies
        working-directory: apps/web/svelte
        run: npm ci

      - name: Run unit tests
        working-directory: apps/web/svelte
        run: npm run test:frontend

  built-bundle-smoke:
    name: Built-bundle CSP smoke check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/svelte/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web/svelte
        run: npm ci

      - name: Run built-bundle smoke check
        # Builds the Svelte SPA, publishes it into server/internal/webapp/static-next,
        # compiles xuva, boots it against a temp data dir on port 18097, polls
        # /api/health, and asserts Content-Security-Policy img-src permits the
        # known artwork hosts. Catches the class of regression behind #67.
        run: node tools/built-bundle-smoke.cjs

  docker-smoke:
    name: Docker package smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t xuva-ci-smoke .

      - name: Run Docker image
        run: |
          docker run -d --name xuva-ci-smoke -p 18097:8097 xuva-ci-smoke
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18097/api/system/version >/tmp/xuva-version.json; then
              cat /tmp/xuva-version.json
              exit 0
            fi
            sleep 2
          done
          docker logs xuva-ci-smoke
          exit 1

      - name: Cleanup Docker container
        if: always()
        run: docker rm -f xuva-ci-smoke >/dev/null 2>&1 || true

  windows-package-scripts:
    name: Windows package script checks
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          # build-package.ps1 + verify-package.ps1 + installer.nsh were
          # retired alongside the NSIS .exe in #451; only the MSI path
          # and the dev-helper scripts remain.
          $files = @(
            "tools/check.ps1",
            "tools/rehearse-install-upgrade-rollback.ps1",
            "packaging/windows/build-msi.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List *
              throw "PowerShell syntax failed for $file"
            }
          }

      - name: Validate release tag guard
        run: node tools/validate-release-tag.cjs v0.0.1

  windows-msi:
    name: Windows MSI build
    runs-on: windows-2025-vs2026
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod

      # Node is needed for both:
      #   - the Svelte SPA build (npm --prefix apps/web/svelte run
      #     publish:go-static) so xuva-server.exe embeds the current
      #     frontend (closes #90)
      #   - the Electron tray bundle (electron-builder) that's harvested
      #     into the MSI's TrayFeature
      # The multi-line cache-dependency-path keys the npm cache off BOTH
      # lockfiles so a change to either invalidates correctly.
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/web/svelte/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install WiX v5
        shell: pwsh
        run: |
          # Pin to WiX v5: v6/v7 gate behind the Open Source Maintenance Fee
          # (OSMF) EULA (WIX7015). v5 is free and uses the same v4/v5 wxs schema.
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Build MSI
        shell: pwsh
        run: ./packaging/windows/build-msi.ps1 -Version 0.0.0.0

      - name: Verify MSI produced
        shell: pwsh
        run: |
          $msi = Get-ChildItem -Path dist/windows-msi -Filter *.msi -ErrorAction SilentlyContinue
          if (-not $msi) { throw "No MSI was produced" }
          Write-Host ("MSI: {0} ({1:N2} MB)" -f $msi.Name, ($msi.Length / 1MB))

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v5
        with:
          name: xuva-msi
          path: dist/windows-msi/*.msi
          if-no-files-found: error
