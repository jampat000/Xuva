name: Security

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go-security:
    name: Go tests and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod

      - name: Agent harness check
        run: node tools/agent-check.cjs

      - name: Test
        working-directory: server
        run: go test ./...

      - name: Vulnerability scan
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  frontend-typecheck:
    name: Frontend svelte-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/svelte/package-lock.json

      - name: Install dependencies
        working-directory: apps/web/svelte
        run: npm ci

      - name: Type-check (svelte-check)
        working-directory: apps/web/svelte
        run: npm run check:ci

  frontend-unit-tests:
    name: Frontend Vitest unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/svelte/package-lock.json

      - name: Install dependencies
        working-directory: apps/web/svelte
        run: npm ci

      - name: Run unit tests
        working-directory: apps/web/svelte
        run: npm run test:frontend

  built-bundle-smoke:
    name: Built-bundle CSP smoke check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/svelte/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web/svelte
        run: npm ci

      - name: Run built-bundle smoke check
        # Builds the Svelte SPA, publishes it into server/internal/webapp/static-next,
        # compiles xuva, boots it against a temp data dir on port 18097, polls
        # /api/health, and asserts Content-Security-Policy img-src permits the
        # known artwork hosts. Catches the class of regression behind #67.
        run: node tools/built-bundle-smoke.cjs

  docker-smoke:
    name: Docker package smoke check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t xuva-ci-smoke .

      - name: Run Docker image
        run: |
          docker run -d --name xuva-ci-smoke -p 18097:8097 xuva-ci-smoke
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18097/api/system/version >/tmp/xuva-version.json; then
              cat /tmp/xuva-version.json
              exit 0
            fi
            sleep 2
          done
          docker logs xuva-ci-smoke
          exit 1

      - name: Cleanup Docker container
        if: always()
        run: docker rm -f xuva-ci-smoke >/dev/null 2>&1 || true

  windows-package-scripts:
    name: Windows package script checks
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate PowerShell syntax
        shell: powershell
        run: |
          $files = @(
            "tools/check.ps1",
            "tools/rehearse-install-upgrade-rollback.ps1",
            "packaging/windows/build-package.ps1",
            "packaging/windows/verify-package.ps1"
          )
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | Format-List *
              throw "PowerShell syntax failed for $file"
            }
          }

      - name: Test Windows package verifier
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP "xuva-package-fixture"
          $resources = Join-Path $root "resources"
          $runtime = Join-Path $resources "runtime"
          $bin = Join-Path $runtime "bin"
          New-Item -ItemType Directory -Path $bin -Force | Out-Null
          "desktop" | Set-Content -LiteralPath (Join-Path $root "Xuva.exe")
          "asar" | Set-Content -LiteralPath (Join-Path $resources "app.asar")
          "server" | Set-Content -LiteralPath (Join-Path $runtime "xuva-server.exe")
          "readme" | Set-Content -LiteralPath (Join-Path $runtime "README.txt")
          "notes" | Set-Content -LiteralPath (Join-Path $runtime "PACKAGE-NOTES.txt")
          "ffmpeg notice" | Set-Content -LiteralPath (Join-Path $runtime "THIRD_PARTY_FFMPEG.txt")
          "ffmpeg" | Set-Content -LiteralPath (Join-Path $bin "ffmpeg.exe")
          "ffprobe" | Set-Content -LiteralPath (Join-Path $bin "ffprobe.exe")

          $zip = Join-Path $env:RUNNER_TEMP "xuva-fixture.zip"
          Compress-Archive -Path (Join-Path $root "*") -DestinationPath $zip -Force
          $sha = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  xuva-fixture.zip" | Set-Content -LiteralPath "$zip.sha256" -Encoding ASCII

          ./packaging/windows/verify-package.ps1 -PackagePath $zip

      - name: Validate release tag guard
        run: node tools/validate-release-tag.cjs v0.0.1
