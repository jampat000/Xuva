name: Android

# Build the Android TV app on every push/PR that touches it. Compile-only
# (assembleDebug) — no signing config or upload step until a real release
# pipeline lands. Path-filtered so other surfaces don't trigger an Android
# Gradle download for no reason. Greenfield app (see apps/android-tv/README.md);
# this job is the only authoritative compile signal because there's no local
# Android toolchain on the maintainer machine.

on:
  push:
    branches: [main]
    paths:
      - 'apps/android-tv/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android-tv/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    name: Build Android TV (debug)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
          build-scan-publish: false

      - name: Gradle versions
        working-directory: apps/android-tv
        run: gradle --version

      - name: assembleDebug
        working-directory: apps/android-tv
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: xuva-tv-debug-apk
          path: apps/android-tv/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
