name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to dry-run or publish, for example v0.0.1'
        required: true
        default: 'v0.0.1'
      dry_run:
        description: 'Build and smoke artifacts without publishing GHCR tags or GitHub Release'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write
  packages: write

jobs:
  version-policy:
    name: Validate release version policy
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v6

      - name: Resolve release inputs
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            DRY_RUN="${{ inputs.dry_run }}"
          else
            VERSION="${GITHUB_REF_NAME}"
            DRY_RUN="false"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"
          echo "dry_run=${DRY_RUN}"

      - name: Validate release tag
        run: node tools/validate-release-tag.cjs "${{ steps.version.outputs.version }}"

  windows:
    name: Build Windows MSI
    runs-on: windows-2025-vs2026
    needs: version-policy
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      # Node is needed by build-msi.ps1 for BOTH the Svelte SPA build
      # (publish:go-static → static-next so xuva-server.exe embeds the
      # current frontend, closes #90) AND the Electron tray bundle that's
      # harvested into the MSI's TrayFeature. Cache keyed off both lockfiles.
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            apps/desktop/package-lock.json
            apps/web/svelte/package-lock.json

      # WiX toolset for the MSI (matches the .github/workflows/security.yml
      # "Windows MSI build" PR job — pinned to v5 to avoid the v6/v7 OSMF EULA gate).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install WiX v5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # The single Windows artifact: a WiX MSI containing the engine + service
      # + ffmpeg + tray Electron bundle. Replaces the previous dual NSIS
      # `.exe`/`.zip` + MSI dance (see #451 for the convergence rationale).
      - name: Build Windows MSI
        shell: powershell
        env:
          XUVA_DEFAULT_TMDB_API_KEY: ${{ secrets.XUVA_DEFAULT_TMDB_API_KEY }}
          XUVA_DEFAULT_FANARTTV_API_KEY: ${{ secrets.XUVA_DEFAULT_FANARTTV_API_KEY }}
          XUVA_DEFAULT_OMDB_API_KEY: ${{ secrets.XUVA_DEFAULT_OMDB_API_KEY }}
        run: |
          ./packaging/windows/build-msi.ps1 -Version "${{ needs.version-policy.outputs.version }}" -OutputDir dist/windows

      # ── Code signing (Azure Trusted Signing) ──────────────────────────────
      # Activates when AZURE_CLIENT_ID is set in repository secrets. The
      # NSIS .exe sign step was dropped along with the NSIS build itself (#451);
      # only the MSI is signed now.
      - name: Check Azure signing configuration
        id: signing_check
        shell: bash
        run: |
          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Sign Windows MSI (Azure Trusted Signing)
        if: steps.signing_check.outputs.enabled == 'true'
        uses: azure/trusted-signing-action@v0
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ secrets.ATS_ENDPOINT }}
          trusted-signing-account-name: ${{ secrets.ATS_ACCOUNT }}
          certificate-profile-name: ${{ secrets.ATS_PROFILE }}
          files-folder: dist/windows
          files-folder-filter: msi
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Checksum the MSI AFTER signing so the .sha256 the updater verifies matches
      # the published (signed) file. Format: "<64-hex>  <filename>" (ASCII), which
      # the server's parseSHA256File reads.
      - name: Generate MSI checksum
        shell: powershell
        run: |
          $msi = Get-ChildItem -Path dist/windows -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) { throw "Server MSI was not produced." }
          $sha = (Get-FileHash -LiteralPath $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$sha  $($msi.Name)" | Set-Content -LiteralPath "$($msi.FullName).sha256" -Encoding ASCII
          Write-Host "MSI:     $($msi.Name) ($([math]::Round($msi.Length / 1MB, 2)) MB)"
          Write-Host "SHA256:  $sha"

      - name: Upload Windows MSI
        uses: actions/upload-artifact@v7
        with:
          name: windows-package
          path: |
            dist/windows/*.msi
            dist/windows/*.sha256

  docker:
    name: Build & publish Docker image
    runs-on: ubuntu-latest
    needs: version-policy
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: ${{ needs.version-policy.outputs.dry_run != 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build date
        id: build_date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ needs.version-policy.outputs.dry_run != 'true' }}
          load: ${{ needs.version-policy.outputs.dry_run == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/xuva:${{ needs.version-policy.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/xuva:latest
          labels: |
            org.opencontainers.image.title=Xuva
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version-policy.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            XUVA_VERSION=${{ needs.version-policy.outputs.version }}
            XUVA_COMMIT=${{ github.sha }}
            XUVA_BUILD_DATE=${{ steps.build_date.outputs.date }}
            XUVA_DEFAULT_TMDB_API_KEY=${{ secrets.XUVA_DEFAULT_TMDB_API_KEY }}
            XUVA_DEFAULT_FANARTTV_API_KEY=${{ secrets.XUVA_DEFAULT_FANARTTV_API_KEY }}
            XUVA_DEFAULT_OMDB_API_KEY=${{ secrets.XUVA_DEFAULT_OMDB_API_KEY }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ needs.version-policy.outputs.dry_run == 'true' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}

      - name: Smoke test Docker image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/xuva:${{ needs.version-policy.outputs.version }}"
          docker run -d --name xuva-release-smoke -p 18097:8097 "$IMAGE"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18097/api/system/version >/tmp/xuva-version.json; then
              cat /tmp/xuva-version.json
              exit 0
            fi
            sleep 2
          done
          docker logs xuva-release-smoke
          exit 1

      - name: Cleanup release Docker smoke
        if: always()
        run: docker rm -f xuva-release-smoke >/dev/null 2>&1 || true

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    if: ${{ needs.version-policy.outputs.dry_run != 'true' }}
    needs:
      - version-policy
      - docker
      - windows
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: windows-package
          path: release-assets

      - name: Extract version
        id: version
        run: echo "tag=${{ needs.version-policy.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git tag --sort=-version:refname | grep -v "^${{ steps.version.outputs.tag }}$" | head -1)
          if [ -n "$PREV" ]; then
            LOG=$(git log "${PREV}".."${{ steps.version.outputs.tag }}" --oneline --no-merges)
          else
            LOG=$(git log --oneline --no-merges)
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "## What's changed" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "$LOG" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "## Docker" >> "$GITHUB_OUTPUT"
          echo '```' >> "$GITHUB_OUTPUT"
          echo "docker pull ghcr.io/${{ github.repository_owner }}/xuva:${{ steps.version.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo '```' >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "## Windows" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "Download \`xuva-server-v*.msi\` and double-click to install. A default install puts in:" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "- the **media server** at \`C:\\Program Files\\Xuva\\xuva-server.exe\` (the engine)," >> "$GITHUB_OUTPUT"
          echo "- the **\"XuvaMediaServer\" Windows Service** that runs the engine at boot as LocalSystem," >> "$GITHUB_OUTPUT"
          echo "- the **Xuva tray app** (Start Menu → Xuva) for browsing the local server, and" >> "$GITHUB_OUTPUT"
          echo "- a SYSTEM scheduled task that silently auto-updates to future MSI releases." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "**Power-user options** (\`msiexec /i xuva-server-v*.msi /qn\`):" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "- \`ADDLOCAL=EngineFeature\` — install the engine + service WITHOUT the tray (headless server)." >> "$GITHUB_OUTPUT"
          echo "- \`XUVA_AUTO_UPDATE=0\` — opt out of the auto-updater scheduled task." >> "$GITHUB_OUTPUT"
          echo "- \`XUVA_RUNTIME_HOME=D:\\XuvaData\` — relocate runtime state (default \`C:\\ProgramData\\Xuva\`)." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "**Migrating from a pre-v0.0.41 install?** Earlier releases shipped two Windows artifacts (a per-user NSIS \`.exe\` desktop app and a separate server MSI). v0.0.41+ converges them into ONE MSI. Uninstall the previous per-user \"Xuva (User)\" entry from Add or Remove Programs before installing this MSI to avoid two side-by-side trays — the MSI install does not detect or remove the legacy NSIS install." >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "> **Windows SmartScreen / Defender warning**" >> "$GITHUB_OUTPUT"
          echo "> Xuva is not yet code-signed. Windows will warn the first time you download/run the MSI." >> "$GITHUB_OUTPUT"
          echo "> " >> "$GITHUB_OUTPUT"
          echo "> **To install anyway:** click \`More info → Run anyway\` in the SmartScreen dialog." >> "$GITHUB_OUTPUT"
          echo "> If Defender quarantines the file: open Windows Security → Virus & threat protection → Protection history → find the item → Allow." >> "$GITHUB_OUTPUT"
          echo "> " >> "$GITHUB_OUTPUT"
          echo "> This is a known false positive. You can verify the file against the \`.sha256\` checksum provided." >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: release-assets/*

  dry-run-summary:
    name: Release dry-run summary
    runs-on: ubuntu-latest
    if: ${{ needs.version-policy.outputs.dry_run == 'true' }}
    needs:
      - version-policy
      - docker
      - windows
    steps:
      - name: Summarize dry run
        run: |
          echo "Release dry run passed for ${{ needs.version-policy.outputs.version }}."
          echo "No GitHub Release was created and no GHCR tags were pushed."
