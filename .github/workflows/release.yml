name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version to dry-run or publish, for example v0.0.1'
        required: true
        default: 'v0.0.1'
      dry_run:
        description: 'Build and smoke artifacts without publishing GHCR tags or GitHub Release'
        required: true
        default: true
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  version-policy:
    name: Validate release version policy
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release inputs
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            DRY_RUN="${{ inputs.dry_run }}"
          else
            VERSION="${GITHUB_REF_NAME}"
            DRY_RUN="false"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dry_run=${DRY_RUN}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}"
          echo "dry_run=${DRY_RUN}"

      - name: Validate release tag
        run: node tools/validate-release-tag.cjs "${{ steps.version.outputs.version }}"

  windows:
    name: Build Windows package
    runs-on: windows-latest
    needs: version-policy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/svelte/package-lock.json

      - name: Build unsigned Windows package
        shell: powershell
        run: |
          ./packaging/windows/build-package.ps1 -Version "${{ needs.version-policy.outputs.version }}"

      - name: Verify unsigned Windows package
        shell: powershell
        run: |
          $package = Get-ChildItem -Path dist/windows -Filter "*.zip" | Select-Object -First 1
          if (-not $package) { throw "Windows package zip was not produced." }
          ./packaging/windows/verify-package.ps1 -PackagePath $package.FullName

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            dist/windows/*.exe
            dist/windows/*.zip
            dist/windows/*.sha256

  docker:
    name: Build & publish Docker image
    runs-on: ubuntu-latest
    needs: version-policy
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ needs.version-policy.outputs.dry_run != 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build date
        id: build_date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ needs.version-policy.outputs.dry_run != 'true' }}
          load: ${{ needs.version-policy.outputs.dry_run == 'true' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/xuva:${{ needs.version-policy.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/xuva:latest
          labels: |
            org.opencontainers.image.title=Xuva
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version-policy.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            XUVA_VERSION=${{ needs.version-policy.outputs.version }}
            XUVA_COMMIT=${{ github.sha }}
            XUVA_BUILD_DATE=${{ steps.build_date.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: ${{ needs.version-policy.outputs.dry_run == 'true' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}

      - name: Smoke test Docker image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/xuva:${{ needs.version-policy.outputs.version }}"
          docker run -d --name xuva-release-smoke -p 18097:8097 "$IMAGE"
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18097/api/system/version >/tmp/xuva-version.json; then
              cat /tmp/xuva-version.json
              exit 0
            fi
            sleep 2
          done
          docker logs xuva-release-smoke
          exit 1

      - name: Cleanup release Docker smoke
        if: always()
        run: docker rm -f xuva-release-smoke >/dev/null 2>&1 || true

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    if: ${{ needs.version-policy.outputs.dry_run != 'true' }}
    needs:
      - version-policy
      - docker
      - windows
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: release-assets

      - name: Extract version
        id: version
        run: echo "tag=${{ needs.version-policy.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        id: changelog
        run: |
          PREV=$(git tag --sort=-version:refname | grep -v "^${{ steps.version.outputs.tag }}$" | head -1)
          if [ -n "$PREV" ]; then
            LOG=$(git log "${PREV}".."${{ steps.version.outputs.tag }}" --oneline --no-merges)
          else
            LOG=$(git log --oneline --no-merges)
          fi
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          echo "## What's changed" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "$LOG" >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "## Docker" >> "$GITHUB_OUTPUT"
          echo '```' >> "$GITHUB_OUTPUT"
          echo "docker pull ghcr.io/${{ github.repository_owner }}/xuva:${{ steps.version.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo '```' >> "$GITHUB_OUTPUT"
          echo "" >> "$GITHUB_OUTPUT"
          echo "## Windows" >> "$GITHUB_OUTPUT"
          echo "Download the unsigned Windows package zip and verify it with the matching .sha256 file." >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.version.outputs.tag }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: release-assets/*

  dry-run-summary:
    name: Release dry-run summary
    runs-on: ubuntu-latest
    if: ${{ needs.version-policy.outputs.dry_run == 'true' }}
    needs:
      - version-policy
      - docker
      - windows
    steps:
      - name: Summarize dry run
        run: |
          echo "Release dry run passed for ${{ needs.version-policy.outputs.version }}."
          echo "No GitHub Release was created and no GHCR tags were pushed."
