  <ellipse cx="50" cy="42" rx="5" ry="10" fill="#1a2440" transform="rotate(15 50 42)"/>
  <!-- feet -->
  <ellipse cx="26" cy="56" rx="5" ry="2.5" fill="#f0a030"/>
