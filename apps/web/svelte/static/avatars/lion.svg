<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <circle cx="32" cy="32" r="32" fill="#C17F24"/>
  <!-- mane -->
  <circle cx="32" cy="32" r="22" fill="#8B5E10"/>
  <!-- face -->
  <ellipse cx="32" cy="34" rx="16" ry="15" fill="#F0C060"/>
  <!-- ears (behind mane peek) -->
  <circle cx="16" cy="20" r="6" fill="#C17F24"/>
  <circle cx="48" cy="20" r="6" fill="#C17F24"/>
  <circle cx="16" cy="20" r="3.5" fill="#e8a840"/>
  <circle cx="48" cy="20" r="3.5" fill="#e8a840"/>
  <!-- eyes -->
  <ellipse cx="25" cy="30" rx="3.5" ry="3" fill="#1a1a2e"/>
  <ellipse cx="39" cy="30" rx="3.5" ry="3" fill="#1a1a2e"/>
  <circle cx="24" cy="29" r="1.2" fill="white"/>
  <circle cx="38" cy="29" r="1.2" fill="white"/>
  <!-- snout -->
  <ellipse cx="32" cy="39" rx="8" ry="5" fill="#e0a840"/>
  <!-- nose -->
  <ellipse cx="32" cy="35.5" rx="3" ry="2" fill="#1a1a2e"/>
  <!-- mouth -->
  <path d="M29 38 Q32 42 35 38" stroke="#8B5E10" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- whiskers -->
  <line x1="14" y1="37" x2="26" y2="38" stroke="#a08030" stroke-width="0.8"/>
  <line x1="50" y1="37" x2="38" y2="38" stroke="#a08030" stroke-width="0.8"/>
</svg>
