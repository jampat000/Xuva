<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!--
    Xuva app icon tile — 1024×1024 with rounded corners.
    Source for iOS App Store icon and tvOS icon layers.
    Updated to match the shipped double-chevron mark design.
  -->
  <defs>
    <radialGradient id="bg" cx="30%" cy="35%" r="75%">
      <stop offset="0%"   stop-color="oklch(0.35 0.14 285)" stop-opacity="0.55"/>
      <stop offset="60%"  stop-color="#080612"/>
      <stop offset="100%" stop-color="#050510"/>
    </radialGradient>
    <linearGradient id="g" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="oklch(0.55 0.22 285)"/>
      <stop offset="55%"  stop-color="oklch(0.65 0.20 280)"/>
      <stop offset="100%" stop-color="oklch(0.72 0.18 265)"/>
    </linearGradient>
    <linearGradient id="gi" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="white" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="240" fill="#080612"/>
  <rect width="1024" height="1024" rx="240" fill="url(#bg)"/>
  <!-- Double chevron scaled to 1024px canvas (16× the 64px mark) -->
  <g filter="url(#glow)">
    <path d="M304 256 L592 512 L304 768" stroke="url(#g)"  stroke-width="112" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M464 256 L752 512 L464 768" stroke="url(#gi)" stroke-width="112" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
